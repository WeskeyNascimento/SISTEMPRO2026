<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church PRO - Gestão de Ministérios e Escalas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK v10.8.0 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-amber-400 flex items-center gap-2">
                ⛪ Church PRO
            </h1>
            <span id="connection-status" class="text-xs bg-emerald-900/60 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-700">
                🟢 Conectando...
            </span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl mx-auto p-4 flex-1 w-full space-y-6">

        <!-- Formulário de Cadastro / Edição de Ministérios -->
        <div class="bg-slate-900 p-5 rounded-xl shadow-lg border border-slate-800">
            <h3 id="form-title" class="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2">
                ✏️ <span id="form-action-label">CADASTRAR NOVO MINISTÉRIO</span>
            </h3>
            <form id="ministry-form" onsubmit="salvarMinisterio(event)">
                <input type="hidden" id="ministry-id">
                
                <div class="mb-3">
                    <label class="block text-sm font-medium text-slate-300 mb-1">NOME DO MINISTÉRIO</label>
                    <input type="text" id="ministry-name" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400" placeholder="Ex: Louvor, Jovens, Diaconia...">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-slate-300 mb-1">LÍDER DO MINISTÉRIO</label>
                    <input type="text" id="ministry-leader" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400" placeholder="Nome do líder responsável">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-1">MEMBROS DA EQUIPE</label>
                    <input type="text" id="ministry-members" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400" placeholder="Ex: Ana, Carlos, Beatriz...">
                </div>

                <div class="flex gap-3">
                    <button type="submit" id="btn-salvar-atualizar" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-2.5 rounded-lg transition-all shadow-md">
                        Salvar Ministério
                    </button>
                    <button type="button" onclick="limparFormularioMinisterio()" class="bg-rose-950 hover:bg-rose-900 text-slate-300 font-semibold px-4 py-2.5 rounded-lg transition-all border border-rose-800/50">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabela de Ministérios Ativos -->
        <div class="bg-slate-900 p-5 rounded-xl shadow-lg border border-slate-800">
            <h3 class="text-lg font-bold text-slate-200 mb-4">MINISTÉRIOS ATIVOS</h3>
            <div class="overflow-x-auto max-h-96 overflow-y-auto rounded-lg border border-slate-800">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider sticky top-0">
                        <tr>
                            <th class="p-3">Nome</th>
                            <th class="p-3">Líder</th>
                            <th class="p-3 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="ministries-table-body" class="divide-y divide-slate-800 text-slate-100 text-sm">
                        <!-- Dados carregados via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-900 border-t border-slate-800 text-center p-4 text-xs text-slate-500">
        Church PRO &copy; 2026 - Todos os direitos reservados.
    </footer>

    <!-- Scripts de Conexão e Regras do Sistema -->
    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA2xFLaPvGGnYLXxytWwFt3icD2vSIC5I",
            authDomain: "estrela-dalva-27844.firebaseapp.com",
            projectId: "estrela-dalva-27844",
            storageBucket: "estrela-dalva-27844.firebasestorage.app",
            messagingSenderId: "820691097921",
            appId: "1:820691097921:web:7904035dfc6dcf024229c0"
        };

        // Inicialização do Firebase e Firestore
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Monitorar status da conexão visualmente
        const statusBadge = document.getElementById('connection-status');
        db.collection("ministerios").limit(1).get().then(() => {
            statusBadge.innerText = "🟢 Conectado ao Cloud";
            statusBadge.className = "text-xs bg-emerald-900/60 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-700";
        }).catch((err) => {
            statusBadge.innerText = "🔴 Erro Conexão";
            statusBadge.className = "text-xs bg-rose-900/60 text-rose-400 px-2.5 py-1 rounded-full border border-rose-700";
        });

        const colecaoMinisterios = "ministerios";

        // 1. Carregar e Listar Ministérios em Tempo Real
        function carregarMinisterios() {
            const tbody = document.getElementById('ministries-table-body');
            if (!tbody) return;

            db.collection(colecaoMinisterios).onSnapshot((snapshot) => {
                tbody.innerHTML = "";
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">Nenhum ministério cadastrado.</td></tr>`;
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const id = doc.id;

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-800/50 transition-colors">
                            <td class="p-3 font-semibold text-slate-200">${escapeHtml(data.nome || '')}</td>
                            <td class="p-3 text-slate-400">${escapeHtml(data.lider || '')}</td>
                            <td class="p-3 text-right flex justify-end gap-2">
                                <button onclick="prepararEdicaoMinisterio('${id}', '${escapeHtml(data.nome)}', '${escapeHtml(data.lider)}', '${escapeHtml(data.membros || '')}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-2.5 py-1.5 rounded font-bold transition-all shadow" title="Editar">
                                    ✏️
                                </button>
                                <button onclick="excluirMinisterio('${id}')" class="bg-rose-600 hover:bg-rose-500 text-white px-2.5 py-1.5 rounded font-bold transition-all shadow" title="Excluir">
                                    ❌
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }, (error) => {
                console.error("Erro ao escutar ministérios: ", error);
            });
        }

        // 2. Salvar (Inserir novo ou Atualizar existente)
        function salvarMinisterio(event) {
            event.preventDefault();
            
            const id = document.getElementById('ministry-id').value;
            const nome = document.getElementById('ministry-name').value.trim();
            const lider = document.getElementById('ministry-leader').value.trim();
            const membros = document.getElementById('ministry-members').value.trim();

            const dadosMinisterio = {
                nome: nome,
                lider: lider,
                membros: membros,
                atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
            };

            const btnSubmit = document.getElementById('btn-salvar-atualizar');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Salvando...";

            if (id) {
                // Atualizar
                db.collection(colecaoMinisterios).doc(id).update(dadosMinisterio)
                    .then(() => {
                        limparFormularioMinisterio();
                        btnSubmit.disabled = false;
                    })
                    .catch((error) => {
                        alert("Erro ao atualizar: " + error.message);
                        btnSubmit.disabled = false;
                        btnSubmit.innerText = "Atualizar Ministério";
                    });
            } else {
                // Inserir Novo
                dadosMinisterio.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
                db.collection(colecaoMinisterios).add(dadosMinisterio)
                    .then(() => {
                        limparFormularioMinisterio();
                        btnSubmit.disabled = false;
                    })
                    .catch((error) => {
                        alert("Erro ao cadastrar: " + error.message);
                        btnSubmit.disabled = false;
                        btnSubmit.innerText = "Salvar Ministério";
                    });
            }
        }

        // 3. Preparar formulário para Editar
        function prepararEdicaoMinisterio(id, nome, lider, membros) {
            document.getElementById('ministry-id').value = id;
            document.getElementById('ministry-name').value = nome;
            document.getElementById('ministry-leader').value = lider;
            document.getElementById('ministry-members').value = membros;
            
            document.getElementById('form-action-label').innerText = "ATUALIZAR MINISTÉRIO";
            const btn = document.getElementById('btn-salvar-atualizar');
            btn.innerText = "Atualizar Ministério";
            btn.className = "flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold p-2.5 rounded-lg transition-all shadow-md";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 4. Excluir Ministério
        function excluirMinisterio(id) {
            if (confirm("Tem certeza que deseja excluir permanentemente este ministério?")) {
                db.collection(colecaoMinisterios).doc(id).delete().catch((error) => {
                    alert("Erro ao excluir: " + error.message);
                });
            }
        }

        // 5. Limpar os campos do formulário
        function limparFormularioMinisterio() {
            document.getElementById('ministry-id').value = "";
            document.getElementById('ministry-name').value = "";
            document.getElementById('ministry-leader').value = "";
            document.getElementById('ministry-members').value = "";
            
            document.getElementById('form-action-label').innerText = "CADASTRAR NOVO MINISTÉRIO";
            const btn = document.getElementById('btn-salvar-atualizar');
            btn.innerText = "Salvar Ministério";
            btn.className = "flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-2.5 rounded-lg transition-all shadow-md";
            btn.disabled = false;
        }

        // Segurança contra quebras de texto HTML nas aspas
        function escapeHtml(text) {
            if (!text) return '';
            return text.toString().replace(/'/g, "&#39;").replace(/"/g, "&quot;");
        }

        // Inicializar assim que carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            carregarMinisterios();
        });
    </script>
</body>
</html>
